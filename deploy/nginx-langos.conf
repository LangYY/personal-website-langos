# langos.buzzegg.cn — 静态站点 nginx 配置
# 放到 ECS：/etc/nginx/conf.d/langos.buzzegg.cn.conf
# 然后： nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name langos.buzzegg.cn;

    root /var/www/langos;
    index index.html;

    # 单文件站点，任何路径都回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（有图片/视频素材后生效）
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|mp4|webm|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    access_log /var/log/nginx/langos.access.log;
    error_log  /var/log/nginx/langos.error.log;
}

