<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="LANG OS——一个人的操作系统。三个磁盘装作品，工具可点开试用。">
<title>LANG OS · 一个人的操作系统</title>
<style>
  :root {
    --desk: #10201C;
    --desk-grid: rgba(140, 190, 175, 0.07);
    --paper: #F6F3EA;
    --paper-edge: #DDD6C4;
    --ink: #22302B;
    --ink-soft: #6D7A72;
    --seal: #C2452C;
    --seal-soft: rgba(194, 69, 44, 0.12);
    --teal: #2E6E62;
    --teal-bright: #7FC4B4;
    --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", serif;
    --sans: "PingFang SC", "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --win-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--sans);
    background: var(--desk);
    color: var(--ink);
    overflow: hidden;
  }

  /* ================= 桌面 ================= */
  #desk {
    position: fixed;
    inset: 0;
    background-color: var(--desk);
    background-image:
      linear-gradient(var(--desk-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--desk-grid) 1px, transparent 1px);
    background-size: 30px 30px;
  }
  #inktrail { position: absolute; inset: 0; pointer-events: none; }

  /* ================= 顶栏 ================= */
  #menubar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 2.1rem;
    display: flex;
    align-items: center;
    gap: 1.2rem;
    padding: 0 1rem;
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    color: var(--teal-bright);
    background: rgba(9, 18, 15, 0.72);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid rgba(127, 196, 180, 0.18);
    z-index: 9000;
    user-select: none;
  }
  #menubar .os-name { color: var(--paper); font-weight: 600; }
  #menubar .os-name .seal-dot { color: var(--seal); }
  #menubar .spacer { flex: 1; }
  #menubar a { color: var(--teal-bright); text-decoration: none; }
  #menubar a:hover { color: var(--paper); }
  #heart { white-space: nowrap; }
  /* 语言切换：显眼的胶囊按钮 */
  #langtoggle {
    display: inline-flex; align-items: center; gap: 0.3rem;
    border: 1px solid var(--teal-bright); border-radius: 999px;
    padding: 0.12rem 0.7rem; white-space: nowrap;
    color: var(--teal-bright); background: rgba(127, 196, 180, 0.1);
    transition: background 0.15s ease, color 0.15s ease;
  }
  #langtoggle:hover { background: var(--teal-bright); color: var(--desk); }
  #langtoggle .tgt { font-weight: 700; }

  /* ================= 桌面图标 ================= */
  #icons {
    position: absolute;
    top: 3.2rem;
    left: 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    max-height: calc(100% - 5rem);
  }
  #icons .group-gap { height: 0.6rem; }
  .icon {
    width: 5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.35rem;
    background: none;
    border: 0;
    cursor: pointer;
    color: rgba(246, 243, 234, 0.85);
    font-family: var(--sans);
  }
  .icon .stamp {
    position: relative;
    width: 3rem;
    height: 3rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--serif);
    font-weight: 700;
    font-size: 1.4rem;
    color: var(--paper);
    border: 2px solid var(--seal);
    border-radius: 6px;
    background: rgba(194, 69, 44, 0.16);
    transform: rotate(-3deg);
    transition: transform 0.18s ease, background 0.18s ease;
  }
  .icon:nth-child(even) .stamp { transform: rotate(2.5deg); }
  .icon:hover .stamp, .icon:focus-visible .stamp {
    transform: rotate(0deg) scale(1.06);
    background: rgba(194, 69, 44, 0.32);
  }
  /* 系统工具用青色描边，与朱砂磁盘区分 */
  .icon.sys .stamp {
    border-color: var(--teal);
    background: rgba(46, 110, 98, 0.16);
    font-size: 1.1rem;
  }
  .icon.sys:hover .stamp, .icon.sys:focus-visible .stamp {
    background: rgba(46, 110, 98, 0.34);
  }
  /* 网络邻居：虚线描边，暗示"在别处" */
  .icon.net .stamp { border-style: dashed; }
  .icon .en {
    position: absolute;
    bottom: -0.35rem; right: -0.35rem;
    font-family: var(--mono);
    font-size: 0.5rem;
    letter-spacing: 0;
    background: var(--desk);
    border: 1px solid currentColor;
    border-radius: 2px;
    padding: 0 0.15rem;
    color: var(--teal-bright);
  }
  .icon:focus-visible { outline: 1px dashed var(--teal-bright); outline-offset: 4px; }
  .icon .label {
    font-size: 0.74rem;
    letter-spacing: 0.06em;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  }

  /* ================= 窗口 ================= */
  .window {
    position: absolute;
    width: min(34rem, calc(100vw - 2rem));
    background: var(--paper);
    border: 1px solid var(--paper-edge);
    box-shadow: var(--win-shadow);
    display: flex;
    flex-direction: column;
    min-width: 15rem;
    min-height: 8rem;
    max-height: calc(100vh - 4rem);
    resize: both;
    overflow: hidden;
  }
  /* 右下角可拖拽缩放的把手 */
  .window::after {
    content: "";
    position: absolute;
    right: 1px; bottom: 1px;
    width: 0.9rem; height: 0.9rem;
    background:
      linear-gradient(135deg, transparent 0 45%, var(--ink-soft) 45% 55%, transparent 55% 70%, var(--ink-soft) 70% 80%, transparent 80%);
    pointer-events: none;
    opacity: 0.6;
  }
  .window.focused { box-shadow: 0 24px 70px rgba(0,0,0,0.6); }
  .titlebar {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.55rem 0.9rem;
    border-bottom: 1px solid var(--paper-edge);
    cursor: grab;
    user-select: none;
    touch-action: none;
  }
  .titlebar:active { cursor: grabbing; }
  .titlebar .t {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.08em;
  }
  .titlebar .path {
    font-family: var(--mono);
    font-size: 0.65rem;
    color: var(--ink-soft);
    letter-spacing: 0.1em;
  }
  .titlebar .spacer { flex: 1; }
  .winbtn {
    width: 0.95rem; height: 0.95rem;
    border-radius: 50%;
    border: 1px solid var(--ink-soft);
    background: transparent;
    cursor: pointer;
    padding: 0;
  }
  .winbtn:hover { background: var(--ink-soft); }
  .winbtn.close { border-color: var(--seal); }
  .winbtn.close:hover { background: var(--seal); }
  .winbody {
    flex: 1 1 auto;
    min-height: 0;
    padding: 1.1rem 1.2rem 1.3rem;
    overflow: auto;
    line-height: 1.8;
    font-size: 0.92rem;
  }
  .winbody h3 { font-family: var(--serif); margin: 0 0 0.6rem; font-size: 1.15rem; }
  .winbody p { margin: 0.5rem 0; }
  .winbody .dim { color: var(--ink-soft); font-size: 0.85rem; }
  .winbody a:not(.btn-launch):not(.node) { color: var(--teal); }
  .winbody a:not(.btn-launch):not(.node):hover { color: var(--seal); }
  .crumb {
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--ink-soft);
    letter-spacing: 0.1em;
    margin: 0 0 0.7rem;
  }

  /* ---------- 文件夹视图（磁盘内容） ---------- */
  .folder { display: flex; flex-direction: column; }
  .fitem {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    padding: 0.7rem 0.5rem;
    border-bottom: 1px solid var(--paper-edge);
    cursor: pointer;
    text-align: left;
    background: none;
    border-left: 0; border-right: 0; border-top: 0;
    width: 100%;
    font-family: var(--sans);
    color: var(--ink);
  }
  .fitem:hover { background: var(--seal-soft); }
  .fitem .fico {
    flex: none;
    width: 2.2rem; height: 2.2rem;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); font-weight: 700; font-size: 1.05rem;
    color: var(--seal);
    border: 1.5px solid var(--seal);
    border-radius: 4px;
    background: var(--seal-soft);
  }
  .fitem .fmeta { flex: 1; min-width: 0; }
  .fitem .fname { font-family: var(--serif); font-weight: 600; font-size: 1rem; }
  .fitem .ftype { font-family: var(--mono); font-size: 0.68rem; color: var(--ink-soft); letter-spacing: 0.08em; }
  .fitem .arrow { color: var(--ink-soft); font-family: var(--mono); }

  /* ---------- 网络邻居 ---------- */
  .neigh { display: flex; flex-direction: column; }
  .neigh a.node {
    display: flex; align-items: center; gap: 0.85rem;
    padding: 0.75rem 0.5rem;
    border-bottom: 1px solid var(--paper-edge);
    text-decoration: none; color: var(--ink);
  }
  .neigh a.node:hover { background: var(--seal-soft); }
  .neigh .nico {
    flex: none; width: 2.2rem; height: 2.2rem;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-weight: 700; font-size: 0.85rem;
    color: var(--teal); border: 1.5px dashed var(--teal); border-radius: 4px;
  }
  .neigh .nname { font-family: var(--serif); font-weight: 600; }
  .neigh .naddr { font-family: var(--mono); font-size: 0.68rem; color: var(--ink-soft); }
  .neigh .nout { margin-left: auto; color: var(--ink-soft); font-family: var(--mono); font-size: 0.72rem; }

  /* app 内嵌 iframe */
  .appframe-wrap { border: 1px solid var(--paper-edge); background: #fff; margin-top: 0.6rem; }
  .appframe-wrap iframe { display: block; width: 100%; height: 26rem; border: 0; }
  /* 含内嵌应用的窗口：iframe 撑满剩余空间，随窗口缩放一起变大 */
  .winbody.has-app { display: flex; flex-direction: column; }
  .winbody.has-app .appframe-wrap { flex: 1 1 auto; min-height: 14rem; margin-bottom: 0.5rem; }
  .winbody.has-app .appframe-wrap iframe { height: 100%; }
  .frame-empty {
    display: flex; flex-direction: column; gap: 0.4rem;
    align-items: center; justify-content: center;
    height: 13rem; margin-top: 0.6rem;
    border: 1px dashed var(--ink-soft);
    font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.12em;
    color: var(--ink-soft); text-align: center; padding: 1rem;
  }
  .btn-launch {
    display: inline-block; margin-top: 0.5rem;
    font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.1em;
    color: var(--paper); background: var(--teal);
    padding: 0.35rem 0.8rem; border-radius: 4px; text-decoration: none;
  }
  .btn-launch:hover { background: var(--seal); }

  /* 视频/图片占位 */
  .media-slot {
    aspect-ratio: 16 / 9;
    border: 1px dashed var(--ink-soft);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.12em;
    color: var(--ink-soft); margin: 0.6rem 0;
  }
  .qr-slot {
    width: 11rem; height: 11rem;
    border: 2px solid var(--seal); border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.12em;
    color: var(--seal); margin: 0.8rem auto; transform: rotate(-2deg);
    text-align: center;
  }
  .figrow { display: flex; gap: 1.6rem; flex-wrap: wrap; margin-top: 0.8rem; padding-top: 0.7rem; border-top: 1px dashed var(--paper-edge); }
  .figrow .n { font-family: var(--mono); font-weight: 600; color: var(--teal); font-variant-numeric: tabular-nums; }
  .figrow .l { font-size: 0.75rem; color: var(--ink-soft); }
  .clients { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.6rem; }
  .clients span { font-family: var(--mono); font-size: 0.7rem; border: 1px solid var(--paper-edge); padding: 0.1rem 0.5rem; border-radius: 3px; color: var(--ink-soft); }

  /* 图片 / 画廊 / 二维码 / 外链按钮组 */
  .shot { display: block; width: 100%; border: 1px solid var(--paper-edge); border-radius: 4px; margin: 0.6rem 0; }
  .shot-sm { max-width: 19rem; }
  .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; margin: 0.7rem 0; }
  .gallery figure { margin: 0; }
  .gallery img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block; border: 1px solid var(--paper-edge); border-radius: 4px; }
  .gallery figcaption { font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.04em; color: var(--ink-soft); margin-top: 0.2rem; }
  .qr-real { display: flex; flex-direction: column; align-items: center; margin: 0.9rem auto 0.4rem; }
  .qr-real img { width: 11rem; height: 11rem; object-fit: contain; background: #fff; border: 2px solid var(--seal); border-radius: 8px; padding: 0.4rem; transform: rotate(-2deg); }
  .qr-real .qr-cap { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.1em; color: var(--seal); margin-top: 0.7rem; text-align: center; }
  .linkrow { display: flex; flex-wrap: wrap; gap: 0.45rem; margin: 0.7rem 0 0.2rem; }
  .linkrow .btn-launch { margin-top: 0; }

  /* 磁盘内联分区（影像 / 移动端 一页展开）*/
  .drive-sect { margin: 0 0 0.2rem; }
  .sect-h { font-family: var(--serif); font-weight: 700; font-size: 1.1rem; margin: 0.1rem 0 0.5rem; color: var(--ink); display: flex; align-items: baseline; gap: 0.55rem; }
  .sect-h .en { font-family: var(--mono); font-size: 0.58rem; letter-spacing: 0.14em; color: var(--seal); }
  hr.sect-div { border: 0; border-top: 1px dashed var(--paper-edge); margin: 1.3rem 0; }
  /* 手机截图 */
  .appshow { display: flex; gap: 1.3rem; align-items: center; flex-wrap: wrap; margin: 0.8rem 0 0.3rem; }
  .phone-shot { display: block; max-width: 12rem; width: 100%; border: 1px solid var(--paper-edge); border-radius: 12px; }
  .appshow .qr-real { margin: 0; }

  /* 问题箱表单 */
  .askform { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.7rem; }
  .askform textarea, .askform input { font-family: var(--sans); font-size: 0.9rem; color: var(--ink); background: #fff; border: 1px solid var(--paper-edge); border-radius: 6px; padding: 0.6rem 0.7rem; width: 100%; box-sizing: border-box; }
  .askform textarea { min-height: 6rem; resize: vertical; line-height: 1.6; }
  .askform textarea:focus, .askform input:focus { outline: none; border-color: var(--teal); }
  .askform button { align-self: flex-start; font-family: var(--mono); font-size: 0.8rem; letter-spacing: 0.08em; color: var(--paper); background: var(--teal); border: 0; border-radius: 6px; padding: 0.5rem 1.1rem; cursor: pointer; }
  .askform button:hover { background: var(--seal); }
  .askform button:disabled { opacity: 0.5; cursor: default; }
  .ask-status { margin-top: 0.5rem; font-size: 0.85rem; min-height: 1.1rem; }
  .ask-status.ok { color: var(--teal); }
  .ask-status.err { color: var(--seal); }

  /* 状态章 */
  .st { font-size: 0.66rem; letter-spacing: 0.08em; padding: 0.1rem 0.45rem; border-radius: 999px; border: 1px solid var(--teal); color: var(--teal); white-space: nowrap; font-family: var(--mono); }
  .st.paused { border-color: var(--ink-soft); color: var(--ink-soft); }
  .st.dead { border-style: dashed; border-color: var(--seal); color: var(--seal); }

  /* ================= 进程管理器 ================= */
  table.ps { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 0.76rem; font-variant-numeric: tabular-nums; }
  table.ps th { text-align: left; font-weight: 400; color: var(--ink-soft); letter-spacing: 0.12em; font-size: 0.66rem; padding: 0.3rem 0.4rem; border-bottom: 1px solid var(--paper-edge); }
  table.ps td { padding: 0.4rem 0.4rem; border-bottom: 1px solid var(--paper-edge); }
  table.ps tr[data-open] { cursor: pointer; }
  table.ps tr[data-open]:hover td { background: var(--seal-soft); }

  /* ================= 终端 ================= */
  .term { background: #0C1714; color: #C8DCD4; font-family: var(--mono); font-size: 0.8rem; line-height: 1.7; padding: 0.9rem 1rem; min-height: 16rem; max-height: 22rem; overflow-y: auto; cursor: text; }
  .term .out { white-space: pre-wrap; word-break: break-word; }
  .term .prompt { color: var(--teal-bright); }
  .term .cmd-echo { color: #F6F3EA; }
  .term-line { display: flex; }
  .term-input { flex: 1; background: none; border: 0; outline: none; color: #F6F3EA; font: inherit; caret-color: var(--seal); padding: 0; }

  /* ================= dock ================= */
  #dock { position: fixed; bottom: 0.9rem; left: 50%; transform: translateX(-50%); display: flex; gap: 0.6rem; padding: 0.45rem 0.7rem; background: rgba(9, 18, 15, 0.72); border: 1px solid rgba(127, 196, 180, 0.18); border-radius: 10px; backdrop-filter: blur(6px); z-index: 9000; }
  #dock:empty { display: none; }
  #dock button { font-family: var(--serif); font-weight: 700; color: var(--paper); background: rgba(194, 69, 44, 0.2); border: 1.5px solid var(--seal); border-radius: 5px; width: 2.2rem; height: 2.2rem; cursor: pointer; font-size: 1rem; }
  #dock button:hover { background: rgba(194, 69, 44, 0.4); }

  /* ================= 开机 ================= */
  #boot { position: fixed; inset: 0; background: var(--desk); z-index: 9999; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: opacity 0.5s ease; }
  #boot.off { opacity: 0; pointer-events: none; }
  #bootlog { font-family: var(--mono); font-size: 0.82rem; line-height: 2.1; color: var(--teal-bright); letter-spacing: 0.06em; padding: 1.5rem; max-width: 36rem; }
  #bootlog .ok { color: var(--paper); }
  #bootlog .warn { color: var(--seal); filter: brightness(1.5); }

  /* ================= 移动端 ================= */
  @media (max-width: 640px) {
    #icons { flex-direction: row; flex-wrap: wrap; max-height: none; left: 1rem; right: 1rem; }
    #icons .group-gap { display: none; }
    .window { position: fixed !important; inset: 2.1rem 0 0 0 !important; width: 100% !important; max-height: none; border-left: 0; border-right: 0; resize: none !important; }
    .window::after { display: none; }
    .titlebar { cursor: default; }
    #menubar .hide-sm { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div id="boot" role="button" aria-label="点击跳过开机动画"><div id="bootlog"></div></div>

<div id="desk"><canvas id="inktrail"></canvas></div>

<div id="menubar">
  <span class="os-name">LANG<span class="seal-dot">·</span>OS <span class="hide-sm">v0.2</span></span>
  <span id="tagline" class="hide-sm"></span>
  <span class="spacer"></span>
  <span id="heart" class="hide-sm"></span>
  <a id="langtoggle" href="#" role="button"></a>
  <a href="mailto:lang.soda@gmail.com">lang.soda@gmail.com</a>
  <span id="clock"></span>
</div>

<div id="icons" role="menu"></div>
<div id="dock"></div>

<script>
(function () {
  "use strict";

  /* ============================================================
     语言：由路径决定 /en → 英文，其余 → 中文；L(zh,en) 取当前语言串
     ============================================================ */
  var LANG = /^\/en(\/|$)/.test(location.pathname) ? "en" : "zh";
  var L = function (zh, en) { return LANG === "en" ? en : zh; };
  document.documentElement.lang = (LANG === "en") ? "en" : "zh-CN";
  document.title = L("LANG OS · 一个人的操作系统", "LANG OS · a one-person OS");

  /* ============================================================
     数据层：三个磁盘 + 网络邻居 + 系统工具
     ============================================================ */

  var esc = function (s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); };
  var mediaSlot = function (t) { return '<div class="media-slot">' + t + '</div>'; };
  var figrow = function (arr) {
    return '<div class="figrow">' + arr.map(function (f) {
      return '<div><div class="n">' + f[0] + '</div><div class="l">' + f[1] + '</div></div>';
    }).join("") + '</div>';
  };
  var appMount = function (url) { return '<div class="app-mount" data-url="' + (url || "") + '"></div>'; };
  var shot = function (src, alt) { return '<img class="shot" src="' + src + '" alt="' + esc(alt || "") + '">'; };
  var gallery = function (arr) {
    return '<div class="gallery">' + arr.map(function (g) {
      return '<figure><img src="' + g[0] + '" alt="' + esc(g[1] || "") + '"><figcaption>' + esc(g[1] || "") + '</figcaption></figure>';
    }).join("") + '</div>';
  };
  var qr = function (src, cap) {
    return '<div class="qr-real"><img src="' + src + '" alt="小程序码"><div class="qr-cap">' + cap + '</div></div>';
  };
  var linkRow = function (arr) {

          '<p class="dim" style="margin-top:0.7rem">' + L("状态如实——在跑的在跑，试用的试用，不做多余修饰。", "States as they are — running is running, trial is trial, no extra dressing.") + '</p>';
      };
    } else if (winId === "terminal") {
      title = L("终端", "Terminal"); ch = "终"; width = 36;
      buildHTML = function () {
        return '<div class="term" tabindex="0"><div class="out">' + L("LANG OS 终端 · 输入 help 查看可用命令", "LANG OS terminal · type help for commands") + '</div>' +
          '<div class="term-line"><span class="prompt">lang@os:~$&nbsp;</span>' +
          '<input class="term-input" autocomplete="off" spellcheck="false" aria-label="' + L("终端输入", "terminal input") + '"></div></div>';
      };
    } else if (winId === "ask") {
      title = L("问题箱", "Ask"); ch = "问"; width = 32;
      buildHTML = function () {
        return '<h3>' + L("问题箱", "Ask me anything") + '</h3>' +
          '<p class="dim">' + L("想问我点什么？留下问题，我会看到。留个联系方式方便回你（选填）。", "Got a question? Leave it here — I’ll see it. A contact is optional so I can reply.") + '</p>' +
          '<form class="askform" novalidate>' +
            '<textarea name="message" required placeholder="' + L("你的问题…", "Your question…") + '"></textarea>' +
            '<input name="contact" placeholder="' + L("邮箱 / 微信（选填，方便回复）", "Email / WeChat (optional)") + '">' +
            '<button type="submit">' + L("投递 ↗", "Send ↗") + '</button>' +
          '</form>' +
          '<div class="ask-status" role="status"></div>';
      };
    } else { return null; }

    return { title: title, path: path, width: width, ch: ch, html: buildHTML };
  }

  function statusCls(s) {
    if (/崩溃|crash/i.test(s)) return "dead";
    if (/挂起|归档|paus|archiv/i.test(s)) return "paused";
    return "";
  }

  function openWindow(winId) {
    if (openWins[winId]) { focusWin(openWins[winId]); unminimize(winId); return; }
    var spec = resolveWindow(winId);
    if (!spec) return;

    var win = document.createElement("div");
    win.className = "window";
    win.style.width = "min(" + spec.width + "rem, calc(100vw - 2rem))";
    var off = (cascade++ % 6) * 2.1;
    win.style.left = "calc(50% - " + (spec.width / 2 - off) + "rem)";
    win.style.top = (3.6 + off * 0.6) + "rem";
    if (isMobile()) { win.style.left = "0"; win.style.top = "2.1rem"; }

    var bar = document.createElement("div");
    bar.className = "titlebar";
    bar.innerHTML = '<span class="t">' + spec.title + '</span><span class="path">' + spec.path + '</span>' +
      '<span class="spacer"></span>' +
      '<button class="winbtn min" title="收进 dock" aria-label="最小化"></button>' +
      '<button class="winbtn close" title="关闭" aria-label="关闭"></button>';
    var body = document.createElement("div");
    body.className = "winbody";
    body.innerHTML = spec.html();

    win.appendChild(bar); win.appendChild(body);
    win.dataset.win = winId; win.dataset.ch = spec.ch;
    document.body.appendChild(win);
    openWins[winId] = win;
    focusWin(win);

    bar.querySelector(".close").addEventListener("click", function () { closeWin(winId); });
    bar.querySelector(".min").addEventListener("click", function () { minimize(winId); });
    win.addEventListener("pointerdown", function () { focusWin(win); });
    enableDrag(win, bar);

    /* 文件夹条目 → 打开作品窗口 */
    body.querySelectorAll(".fitem[data-item]").forEach(function (el) {
      el.addEventListener("click", function () { openWindow("item:" + el.dataset.item); });
    });
    /* 进程表 → 打开对应窗口 */
    body.querySelectorAll("tr[data-open]").forEach(function (tr) {
      tr.addEventListener("click", function () { openWindow(tr.dataset.open); });
    });
    /* iframe 挂载 */
    var mount = body.querySelector(".app-mount");
    if (mount) {
      var url = mount.dataset.url;
      if (url) {
        var wrap = document.createElement("div"); wrap.className = "appframe-wrap";
        var f = document.createElement("iframe");
        f.src = url; f.title = spec.title;
        f.setAttribute("referrerpolicy", "no-referrer");
        f.setAttribute("allow", "clipboard-read; clipboard-write; fullscreen");
        wrap.appendChild(f);
        var open = document.createElement("a");
        open.className = "btn-launch"; open.href = url; open.target = "_blank"; open.rel = "noopener";
        open.textContent = "在新标签全屏打开 ↗";
        mount.replaceWith(wrap); wrap.after(open);
        body.classList.add("has-app");
        if (!isMobile()) win.style.height = "min(82vh, 46rem)";
      } else {
        var empty = document.createElement("div");
        empty.className = "frame-empty";
        empty.innerHTML = L("线上地址待接入<br>部署 / 备案完成后，这里就能直接试用", "URL coming soon<br>once deployed, it runs right here");
        mount.replaceWith(empty);
      }
    }
    /* 终端 */
    var term = body.querySelector(".term");
    if (term) initTerm(term);
    /* 问题箱表单 */
    var askForm = body.querySelector(".askform");
    if (askForm) initAsk(askForm, body.querySelector(".ask-status"));
  }

  function initAsk(form, status) {
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var msg = form.message.value.trim();
      if (!msg) { status.className = "ask-status err"; status.textContent = L("先写点问题再投递～", "Write a question first ~"); return; }
      var btn = form.querySelector("button");
      btn.disabled = true; status.className = "ask-status"; status.textContent = L("投递中…", "Sending…");
      fetch(ASK_ENDPOINT, {
        method: "POST",
        headers: { "Accept": "application/json", "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg, contact: form.contact.value.trim(), _subject: "LANG OS 问题箱" })
      }).then(function (r) {
        if (!r.ok) throw new Error("bad");
        form.reset();
        status.className = "ask-status ok"; status.textContent = L("已投递，谢谢！我会看到。", "Sent — thank you! I’ll see it.");
      }).catch(function () {
        status.className = "ask-status err";
        status.innerHTML = L("投递失败，直接发我也行：", "Couldn’t send — email me instead: ") + '<a href="mailto:lang.soda@gmail.com" style="color:var(--seal)">lang.soda@gmail.com</a>';
      }).then(function () { btn.disabled = false; });
    });
  }

  function closeWin(id) { var w = openWins[id]; if (w) { w.remove(); delete openWins[id]; removeDock(id); } }
  function focusWin(win) {
    document.querySelectorAll(".window").forEach(function (w) { w.classList.remove("focused"); });
    win.classList.add("focused"); win.style.zIndex = ++zTop;
  }
  function minimize(id) {
    var w = openWins[id]; if (!w) return;
    w.style.display = "none";
    if (!dock.querySelector('[data-dock="' + id + '"]')) {
      var b = document.createElement("button");
      b.dataset.dock = id; b.title = openWins[id].dataset.win;
      b.textContent = w.dataset.ch;
      b.addEventListener("click", function () { unminimize(id); });
      dock.appendChild(b);
    }
  }
  function unminimize(id) { var w = openWins[id]; if (!w) return; w.style.display = ""; focusWin(w); removeDock(id); }
  function removeDock(id) { var d = dock.querySelector('[data-dock="' + id + '"]'); if (d) d.remove(); }

  /* 拖拽 */
  function enableDrag(win, bar) {
    var sx, sy, ox, oy, dragging = false;
    bar.addEventListener("pointerdown", function (e) {
      if (e.target.closest(".winbtn") || isMobile()) return;
      dragging = true; sx = e.clientX; sy = e.clientY;
      var r = win.getBoundingClientRect(); ox = r.left; oy = r.top;
      bar.setPointerCapture(e.pointerId);
    });
    bar.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      win.style.left = (ox + e.clientX - sx) + "px";
      win.style.top = Math.max(2.1 * 16, oy + e.clientY - sy) + "px";
    });
    bar.addEventListener("pointerup", function () { dragging = false; });
    bar.addEventListener("pointercancel", function () { dragging = false; });
  }

  /* 终端 */
  function initTerm(term) {
    var input = term.querySelector(".term-input");
    var line = term.querySelector(".term-line");
    term.addEventListener("click", function () { input.focus(); });
    function print(html) { var d = document.createElement("div"); d.className = "out"; d.innerHTML = html; term.insertBefore(d, line); }
    input.addEventListener("keydown", function (e) {
      if (e.key !== "Enter") return;
      var cmd = input.value.trim();
      print('<span class="prompt">lang@os:~$</span> <span class="cmd-echo">' + esc(cmd) + "</span>");
      if (cmd) run(cmd, print, term);
      input.value = ""; term.scrollTop = term.scrollHeight;
    });
  }
  function run(cmd, print, term) {
    var parts = cmd.split(/\s+/), c = parts[0].toLowerCase();
    switch (c) {
      case "help":
        print(L("可用命令：\n  ls            列出磁盘与作品\n  open <名字>   打开窗口，如 open 熊猫团团\n  ask           问题箱 · 问我点什么\n  contact       联系方式\n  coffee        ☕ 送你一杯咖啡\n  date          现在几点\n  clear         清屏\n  sudo hire     （需要权限）\n\n（还有几个命令没写出来，自己试试）",
          "Commands:\n  ls            list disks & works\n  open <name>   open a window, e.g. open panda\n  ask           ask box · ask me anything\n  contact       contact\n  coffee        ☕ a coffee on me\n  date          time now\n  clear         clear screen\n  sudo hire     (permission required)\n\n(a few more aren’t listed — try them)")); break;
      case "ask": openWindow("ask"); print(L("打开问题箱…", "Opening the ask box…")); break;
      case "contact": case "email":
        print(L("联系方式：", "Contact: ") + '<a href="mailto:lang.soda@gmail.com" style="color:#7FC4B4">lang.soda@gmail.com</a>'); break;
      case "coffee":
        print(L("☕ 送你一杯咖啡。领取方式：加微信 <span style=\"color:#F6F3EA\">langyy</span>（备注咖啡）。", "☕ A coffee on me. To claim: add WeChat <span style=\"color:#F6F3EA\">langyy</span> (note: coffee).")); break;
      case "ls":
        print(L("磁盘：影像:/  网页:/  移动端:/     网络邻居：小红书 X GitHub\n影像:/   熊猫团团  商业影像\n网页:/   English Dictation  FocusTree  FrameSonata\n移动端:/ HTML预览  IG存图  顺便",
          "Disks: IMAGE:/  WEB:/  MOBILE:/     Elsewhere: Xiaohongshu X GitHub\nIMAGE:/  Panda TuanTuan  Buzzegg\nWEB:/    English Dictation  Focus Tree  Frame Sonata\nMOBILE:/ HTML Preview  IG Saver  Shunbian")); break;
      case "date": print(new Date().toLocaleString(L("zh-CN", "en-US"))); break;
      case "clear":
        term.querySelectorAll(".out").forEach(function (o) { o.remove(); }); break;
      case "open":
        var name = parts.slice(1).join("").toLowerCase();
        var map = {
          "影像": "drive:moving", "网页": "drive:web", "移动端": "drive:mobile",
          "image": "drive:moving", "video": "drive:moving", "web": "drive:web", "mobile": "drive:mobile",
          "网络邻居": "about", "邻居": "about", "社交": "about", "elsewhere": "about",
          "熊猫团团": "item:panda", "熊猫": "item:panda", "团团": "item:panda", "panda": "item:panda",
          "商业影像": "item:buzzegg", "buzzegg": "item:buzzegg",
          "englishdictation": "item:dictation", "dictation": "item:dictation", "听写": "item:dictation",
          "focustree": "item:focustree", "树": "item:focustree",
          "framesonata": "item:framesonata", "谱": "item:framesonata",
          "小程序": "item:miniapp", "html预览": "item:miniapp", "html": "item:miniapp", "htmlpreview": "item:miniapp",
          "ig存图": "item:iglink", "ig": "item:iglink", "存图": "item:iglink", "iglinksaver": "item:iglink",
          "顺便": "item:shunbian", "shunbian": "item:shunbian",
          "关于": "about", "about": "about", "进程": "ps", "processes": "ps", "终端": "terminal", "terminal": "terminal",
          "问题箱": "ask", "提问": "ask", "问": "ask", "question": "ask"
        };
        var id = map[name];
        if (id) { openWindow(id); print(L("正在打开 ", "Opening ") + esc(name) + " …"); }
        else print(L("open: 找不到「" + esc(name) + "」。试试 ls", "open: can’t find “" + esc(name) + "”. try ls")); break;
      case "sudo":
        if (/hire|招我|offer/i.test(cmd))
          print(L('权限确认通过。\n<span style="color:#F6F3EA">联系方式已解锁：</span><a href="mailto:lang.soda@gmail.com" style="color:#7FC4B4">lang.soda@gmail.com</a>\n（这个命令的存在，说明这台机器的主人对新的可能性保持开机状态）',
            'Access granted.\n<span style="color:#F6F3EA">Contact unlocked: </span><a href="mailto:lang.soda@gmail.com" style="color:#7FC4B4">lang.soda@gmail.com</a>\n(that this command exists means the owner stays open to new possibilities)'));
        else print(L("sudo: 想清楚再用 root 权限。", "sudo: think before you use root.")); break;
      case "rm": print(L("rm: 拒绝执行。这台机器上的进程，一个都舍不得删。", "rm: refused. Not one process here I’m willing to delete.")); break;
      case "exit": print(L("exit: 这里是乐园，不设出口。关掉窗口就好。", "exit: this is a playground, no exit. Just close a window.")); break;
      default:
        print(esc(c) + L(": 命令不存在。输入 help 看看有什么。", ": command not found. type help."));
    }
  }

  /* ---------- 墨迹 ---------- */
  var canvas = document.getElementById("inktrail"), ctx = canvas.getContext("2d");
  var drops = [], reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function sizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  sizeCanvas(); window.addEventListener("resize", sizeCanvas);
  if (!reduced) {
    window.addEventListener("pointermove", function (e) {
      drops.push({ x: e.clientX, y: e.clientY, r: 1.5 + Math.random() * 2.5, a: 0.22 });
      if (drops.length > 120) drops.shift();
    });
    (function tick() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (var i = 0; i < drops.length; i++) {
        var d = drops[i]; d.a *= 0.965; d.r += 0.08;
        if (d.a < 0.005) continue;
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(127, 196, 180," + d.a + ")"; ctx.fill();
      }
      requestAnimationFrame(tick);
    })();
  }

  /* ---------- 菜单栏 · 语言切换 ---------- */
  document.getElementById("tagline").textContent = L("一个人的操作系统", "A one-person operating system");
  document.getElementById("heart").textContent = L("心力 ▓▓▓▓▓░░ 恢复中", "Energy ▓▓▓▓▓░░ recovering");
  (function () {
    var b = document.getElementById("langtoggle");
    b.innerHTML = '<span class="hide-sm">语言/Language ·&nbsp;</span><span class="tgt">' + L("EN", "中") + '</span>';
    b.title = L("Switch to English", "切换到中文");
    b.addEventListener("click", function (e) {
      e.preventDefault();
      try { sessionStorage.setItem("langos-booted", "1"); } catch (err) {}
      location.pathname = (LANG === "en") ? "/zh" : "/en";
    });
  })();

  /* ---------- 时钟 ---------- */
  var clock = document.getElementById("clock");
  function tickClock() { var n = new Date(); clock.textContent = String(n.getHours()).padStart(2, "0") + ":" + String(n.getMinutes()).padStart(2, "0"); }
  tickClock(); setInterval(tickClock, 15000);

  /* ---------- 开机 ---------- */
  var boot = document.getElementById("boot"), log = document.getElementById("bootlog");
  var lines = LANG === "en" ? [
    ["LANG OS v0.2 — a one-person operating system", ""],
    ["Mounting disks  IMAGE:/  WEB:/  MOBILE:/ …", "ok"],
    ["Connecting elsewhere  RED · X · GitHub …", "ok"],
    ["Checking unfinished projects… several", "warn"],
    ["Starting energy manager… recovering", "ok"],
    ["Welcome back.", ""]
  ] : [
    ["LANG OS v0.2 — 一个人的操作系统", ""],
    ["挂载磁盘 影像:/ 网页:/ 移动端:/ ……", "ok"],
    ["连接网络邻居 小红书 · X · GitHub ……", "ok"],
    ["检查未完成项目…… 若干", "warn"],
    ["启动心力管理进程…… 恢复中", "ok"],
    [L("欢迎回来。", "Welcome back."), ""]
  ];
  var booted = false; try { booted = sessionStorage.getItem("langos-booted") === "1"; } catch (err) {}
  function endBoot() { try { sessionStorage.setItem("langos-booted", "1"); } catch (e) {} boot.classList.add("off"); setTimeout(function () { boot.remove(); }, 600); if (!isMobile()) openWindow("about"); }
  boot.addEventListener("click", endBoot);
  if (reduced || booted) { endBoot(); }
  else {
    var i = 0;
    (function next() {
      if (!document.body.contains(boot) || boot.classList.contains("off")) return;
      if (i >= lines.length) { setTimeout(endBoot, 700); return; }
      var d = document.createElement("div");
      if (lines[i][1]) d.className = lines[i][1];
      d.textContent = lines[i][0]; log.appendChild(d); i++;
      setTimeout(next, 380);
    })();
  }
})();
</script>
